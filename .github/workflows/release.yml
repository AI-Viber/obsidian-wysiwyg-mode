name: Release Obsidian plugin

# Push a tag that matches the version in manifest.json (e.g. 1.0.0, no "v")
# and this builds the plugin and creates a draft release with the three files
# Obsidian needs: main.js, manifest.json and styles.css.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build
        run: |
          npm install
          npm run build

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
